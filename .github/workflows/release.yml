name: Release

# Builds the four engine binaries (Linux/Windows × CUDA/CPU), bundles libcudart, and
# produces the Saient desktop bundles (.deb / .rpm / .AppImage on Linux, .exe NSIS on
# Windows). Runs on a version tag (v*) and on manual dispatch.
#
# The CUDA binaries are built with TINYQ4_CUDA_ARCH=all-major so they carry SASS for every
# major NVIDIA arch (Turing→Blackwell) + PTX — they run on any GPU with just the driver,
# because libcudart ships in the bundle (engine.rs puts it on the loader path at launch).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  TINYQ4_CUDA_ARCH: all-major
  # The engine crate was renamed tinyq4 -> saient-quartz and its build.rs now
  # reads QUARTZ_CUDA_ARCH. The old name is ignored, so both platforms fell
  # back to the local-dev default sm_120, which nvcc 12.6 rejects. Both names
  # are exported so either engine revision builds.
  QUARTZ_CUDA_ARCH: all-major
  TINYQ4_REPO: SaientAI/saient-quartz
  # Same engine revision verified in both public 1.0.23 build logs. Both
  # platforms must build one immutable source revision, not moving branches.
  TINYQ4_REF: 5a2a82387b9548c6c165eb50880a5f49c54ef1ff
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  # 12.6.x is broadly supported by the toolkit action and, with all-major, still runs on
  # Blackwell (RTX 50xx) via PTX JIT. For native sm_120 SASS, bump to 12.8.x AND bump the
  # Jimver/cuda-toolkit tag below to a version that knows 12.8.
  CUDA_VERSION: '12.6.2'

jobs:
  # ── Linux: .deb / .rpm / .AppImage ────────────────────────────────────────────
  linux:
    name: Linux bundle
    runs-on: ubuntu-22.04           # older glibc → AppImage runs on more distros
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout tinyq4 engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINYQ4_REPO }}
          ref: ${{ env.TINYQ4_REF }}
          ssh-key: ${{ secrets.TINYQ4_DEPLOY_KEY }}
          path: tinyq4-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Runtime regression gate
        working-directory: llm-inference
        run: |
          set -euo pipefail
          for suite in runtime_file_lock saient_binding_cache terminal_completion terminal_interrupt terminal_conscience terminal_report terminal_windows release_provenance project_store project_jobs project_controller project_recovery; do
            python tools/test_${suite}.py
          done

      - name: Tauri + AppImage system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            llm-inference/src-tauri
            tinyq4-src

      - name: Install CUDA toolkit (${{ env.CUDA_VERSION }})
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'

      - name: Build + stage engine (CUDA all-major + CPU + libcudart)
        run: |
          CUDA_HOME="$CUDA_PATH" \
          TINYQ4_SRC="${{ github.workspace }}/tinyq4-src" \
          TINYQ4_CUDA_ARCH="${{ env.TINYQ4_CUDA_ARCH }}" \
          QUARTZ_CUDA_ARCH="${{ env.QUARTZ_CUDA_ARCH }}" \
          bash scripts/build-engine.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: llm-inference/package-lock.json

      - name: Install frontend deps
        working-directory: llm-inference
        run: npm ci

      - name: Tauri build (deb / appimage)
        working-directory: llm-inference
        run: npm run tauri -- build --bundles deb,appimage --ci -- --locked

      - name: Collect this version's Linux bundles
        run: |
          set -euo pipefail
          release_version=$(node -p "require('./llm-inference/src-tauri/tauri.conf.json').version")
          mkdir -p release-provenance/linux
          cp "llm-inference/src-tauri/target/release/bundle/deb/Saient_${release_version}_amd64.deb" release-provenance/linux/
          cp "llm-inference/src-tauri/target/release/bundle/appimage/Saient_${release_version}_amd64.AppImage" release-provenance/linux/

      - name: Capture final Linux checksums and source provenance
        run: >-
          python llm-inference/tools/release_provenance.py
          --repo-root . --engine-root tinyq4-src --platform linux
          --artifact-dir release-provenance/linux
          --output-dir release-provenance/linux

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: saient-linux
          path: release-provenance/linux/*
          if-no-files-found: error

  # ── Windows: NSIS installer (.exe) ────────────────────────────────────────────
  windows:
    name: Windows bundle
    # windows-latest moved to a Visual Studio newer than CUDA 12.6 accepts:
    #   host_config.h: unsupported Microsoft Visual Studio version!
    #   Only the versions between 2017 and 2022 (inclusive) are supported
    # Pinned rather than passing nvcc -allow-unsupported-compiler, which
    # disables the check instead of satisfying it.
    runs-on: windows-2022
    # Step-level `if:` cannot read the secrets context directly, so the two
    # values that gate signing are surfaced as env for the guards below.
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - name: Preserve source bytes for runtime hash verification
        run: git config --global core.autocrlf false

      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout tinyq4 engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TINYQ4_REPO }}
          ref: ${{ env.TINYQ4_REF }}
          ssh-key: ${{ secrets.TINYQ4_DEPLOY_KEY }}
          path: tinyq4-src

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Native Windows runtime regression gate
        working-directory: llm-inference
        shell: bash
        run: |
          set -euo pipefail
          for suite in runtime_file_lock saient_binding_cache terminal_completion terminal_interrupt terminal_conscience terminal_report terminal_windows release_provenance project_store project_jobs project_controller project_recovery; do
            python tools/test_${suite}.py
          done

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            llm-inference/src-tauri
            tinyq4-src

      - name: Install CUDA toolkit (${{ env.CUDA_VERSION }})
        uses: Jimver/cuda-toolkit@v0.2.21
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: 'network'

      # nvcc needs the MSVC host compiler (cl.exe) on PATH.
      - name: Set up MSVC (cl.exe for nvcc)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build + stage engine (CUDA all-major + CPU + cudart dll)
        shell: pwsh
        run: |
          $eng = "llm-inference/src-tauri/resources/engine"
          New-Item -ItemType Directory -Force -Path $eng | Out-Null
          Push-Location tinyq4-src
          # CPU build (separate target dir so it doesn't clobber the CUDA build)
          $env:CARGO_TARGET_DIR = "$env:RUNNER_TEMP\tq4-cpu"
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw 'CPU engine build failed' }
          $cpuBin = @("$env:RUNNER_TEMP\tq4-cpu\release\quartz.exe","$env:RUNNER_TEMP\tq4-cpu\release\tinyq4.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cpuBin) { Get-ChildItem "$env:RUNNER_TEMP\tq4-cpu\release"; throw "no engine binary (cpu)" }
          Copy-Item $cpuBin "..\$eng\tinyq4-cpu.exe"
          Remove-Item Env:\CARGO_TARGET_DIR
          # CUDA build (all-major) — CUDA_HOME from the toolkit action's CUDA_PATH
          $env:CUDA_HOME = $env:CUDA_PATH
          # Linux sets this; Windows did not, so the engine fell back to its
          # local-dev default of sm_120 and nvcc 12.6 rejected it outright
          # ("Value 'sm_120' is not defined for option 'gpu-architecture'").
          # all-major emits SASS for every major arch and JITs on Blackwell.
          $env:TINYQ4_CUDA_ARCH = "${{ env.TINYQ4_CUDA_ARCH }}"
          $env:QUARTZ_CUDA_ARCH = "${{ env.QUARTZ_CUDA_ARCH }}"
          cargo build --release --locked --features cuda
          if ($LASTEXITCODE -ne 0) { throw 'CUDA engine build failed' }
          $cudaBin = @("target\release\quartz.exe","target\release\tinyq4.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cudaBin) { Get-ChildItem "target\release"; throw "no engine binary (cuda)" }
          Copy-Item $cudaBin "..\$eng\tinyq4-cuda.exe"
          Pop-Location
          # Bundle the CUDA runtime DLL so the engine runs without a CUDA install.
          Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll" "$eng\cudart64_12.dll"
          Get-ChildItem $eng

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: llm-inference/package-lock.json

      - name: Install frontend deps
        working-directory: llm-inference
        run: npm ci

      - name: Tauri build (NSIS)
        working-directory: llm-inference
        # tauri.windows.conf.json sets createUpdaterArtifacts, so the bundler
        # needs the updater signing key or it fails after producing the
        # installer: "A public key has been found, but no private key."
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --bundles nsis --ci -- --locked

      # ── Authenticode signing ──────────────────────────────────────────────
      # Free OSS certificate from the SignPath Foundation; see
      # CODE_SIGNING_POLICY.md. The secrets only exist once the SignPath project
      # is approved, so until then the signing steps skip and the release
      # carries the unsigned installer — which is what the policy document
      # already promises to label as such.
      #
      # SignPath reads its input from a GitHub artifact, so the installer is
      # uploaded first under an `internal-` name. The draft-release job only
      # collects `saient-*`, so this intermediate is never published.
      - name: Upload installer for signing
        id: upload_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: internal-windows-unsigned
          path: llm-inference/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Sign installer (SignPath)
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Collect final Windows installer and updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $finalDir = 'release-provenance/windows'
          New-Item -ItemType Directory -Force -Path $finalDir | Out-Null
          $sourceDir = if ($env:SIGNPATH_API_TOKEN) { 'signed' } else { 'llm-inference/src-tauri/target/release/bundle/nsis' }
          $releaseVersion = (Get-Content llm-inference/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem $sourceDir -Filter "Saient_${releaseVersion}_x64-setup.exe")
          if ($installers.Count -ne 1) { throw 'Expected exactly one final Windows installer' }
          $installer = $installers[0]
          if ($env:SIGNPATH_API_TOKEN) {
            # Authenticode changes the bytes. Sign those FINAL bytes for the
            # updater instead of reusing the pre-Authenticode signature.
            Push-Location llm-inference
            npm run tauri -- signer sign $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Final installer updater signing failed' }
            Pop-Location
          }
          $signature = $installer.FullName + '.sig'
          if (-not (Test-Path $signature)) { throw 'Final installer updater signature is missing' }
          Copy-Item $installer.FullName $finalDir
          Copy-Item $signature $finalDir

      - name: Capture final Windows checksums and source provenance
        run: >-
          python llm-inference/tools/release_provenance.py
          --repo-root . --engine-root tinyq4-src --platform windows
          --artifact-dir release-provenance/windows
          --output-dir release-provenance/windows

      - name: Upload Windows installer and provenance
        uses: actions/upload-artifact@v4
        with:
          name: saient-windows
          path: release-provenance/windows/*
          if-no-files-found: error

  # ── Draft GitHub Release with all bundles (tag builds only) ────────────────────
  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Only published bundles. Excludes `internal-windows-unsigned`, the
          # pre-signing copy SignPath consumes.
          pattern: saient-*

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/**/*
          generate_release_notes: true
